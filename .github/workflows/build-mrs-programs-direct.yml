name: Build MRS Programs Direct Ruleset

on:
  push:
    branches: [main]
    paths:
      - "rules/programs/programs_direct.yaml"
      - "scripts/convert-yaml-to-mrs-programs-direct.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download mihomo binary
        run: |
          curl -L -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Extract rules from YAML
        run: python scripts/convert-yaml-to-mrs-programs-direct.py

      - name: Build MRS
        run: |
          mkdir -p dist
          if [ -s /tmp/combined-programs-direct.txt ]; then
            mihomo convert-ruleset classical text /tmp/combined-programs-direct.txt dist/programs_direct.mrs
          else
            echo "No rules, creating empty .mrs"
            touch dist/programs_direct.mrs
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/programs_direct.mrs
          git commit -m "chore: rebuild programs_direct.mrs [skip ci]" || exit 0
          git push
