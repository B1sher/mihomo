name: Build MRS Ads Ruleset

on:
  push:
    branches: [main]
    paths:
      - "rules/ads/*.yaml"
      - "scripts/convert-yaml-to-mrs-ads.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download mihomo binary
        run: |
          curl -L -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Extract domains from YAML
        run: python scripts/convert-yaml-to-mrs-ads.py

      - name: Build MRS
        run: |
          mkdir -p dist
          mihomo convert-ruleset domain text /tmp/combined-ads.txt dist/ads.mrs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ads.mrs
          git commit -m "chore: rebuild ads.mrs [skip ci]" || exit 0
          git push
