name: Build MRS Rules

on:
  push:
    paths:
      - '*.yaml'
      - '*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo binary
        run: |
          # Скачиваем готовый бинарник mihomo
          MIHOMO_VERSION="v1.19.0"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Compile MRS files
        run: |
          mkdir -p mrs
          # PC
          ./mihomo convert-ruleset domain yaml ads_pc.yaml mrs/ads_pc.mrs
          # Android
          ./mihomo convert-ruleset domain yaml ads_phone.yaml mrs/ads_phone.mrs
          # Crossplatform
          ./mihomo convert-ruleset domain yaml ads_crossplatform.yaml mrs/ads_crossplatform.mrs
          # Direct
          ./mihomo convert-ruleset domain yaml direct.yaml mrs/direct.mrs
          # Proxy
          ./mihomo convert-ruleset domain yaml proxy.yaml mrs/proxy.mrs

      - name: Upload MRS to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest MRS Rules
          files: |
            mrs/*.mrs
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}