name: Build MRS Rules

on:
  push:
    paths:
      - 'rules/**/*.yaml'
      - 'rules/*.yaml'
      - 'scripts/*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo binary
        run: |
          MIHOMO_VERSION="v1.19.0"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Compile MRS files
        run: |
          mkdir -p mrs
          # PC = rules/ads/pc.yaml
          ./mihomo convert-ruleset domain yaml rules/ads/pc.yaml mrs/ads_pc.mrs
          # Phone = rules/ads/android.yaml
          ./mihomo convert-ruleset domain yaml rules/ads/android.yaml mrs/ads_phone.mrs
          # Crossplatform
          ./mihomo convert-ruleset domain yaml rules/ads/crossplatform.yaml mrs/ads_crossplatform.mrs
          # Direct
          ./mihomo convert-ruleset domain yaml rules/direct.yaml mrs/direct.mrs
          # Proxy
          ./mihomo convert-ruleset domain yaml rules/proxy.yaml mrs/proxy.mrs

      - name: Upload MRS to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest MRS Rules
          files: |
            mrs/*.mrs
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
