name: Build MRS Rules

on:
  push:
    paths:
      - 'rules/**/*.yaml'
      - 'rules/*.yaml'
      - 'scripts/*.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo binary
        run: |
          MIHOMO_VERSION="v1.19.0"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Merge YAML for PC
        run: |
          mkdir -p mrs
          cat rules/ads/pc.yaml rules/ads/crossplatform.yaml > /tmp/ads_pc_merged.yaml

      - name: Merge YAML for Phone
        run: |
          cat rules/ads/android.yaml rules/ads/crossplatform.yaml > /tmp/ads_phone_merged.yaml

      - name: Compile MRS files
        run: |
          ./mihomo convert-ruleset domain yaml /tmp/ads_pc_merged.yaml mrs/ads_pc.mrs
          ./mihomo convert-ruleset domain yaml /tmp/ads_phone_merged.yaml mrs/ads_phone.mrs
          ./mihomo convert-ruleset domain yaml rules/direct.yaml mrs/direct.mrs
          ./mihomo convert-ruleset domain yaml rules/proxy.yaml mrs/proxy.mrs

      - name: Update README
        run: |
          python3 scripts/update_readme.py

      - name: Commit README to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update raw links [skip ci]" || echo "No changes to README"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Wait to avoid race condition
        run: sleep 5

      - name: Commit MRS to mrs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin mrs
          git checkout -b mrs-temp origin/mrs 2>/dev/null || git checkout --orphan mrs-temp
          git rm -rf . 2>/dev/null || true
          
          cp mrs/*.mrs .
          
          git add *.mrs
          git commit -m "update: mrs $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          
          git push origin mrs-temp:mrs --force-with-lease
