name: Build Rule Lists

on:
  push:
    branches: [main]
    paths:
      - 'rules/ads/**.yaml'
      - 'rules/direct.yaml'
      - 'rules/proxy.yaml'
      - 'scripts/deduplicate.py'
      - 'scripts/update_readme.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rule-lists
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest mihomo binary
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
            grep "browser_download_url.*linux-amd64-v1.*\.gz" | \
            grep -v "go12" | \
            cut -d '"' -f 4 | \
            head -n 1)
          
          echo "Скачиваем: $LATEST_URL"
          curl -L -o mihomo.gz "$LATEST_URL"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Merge YAML files
        run: |
          mkdir -p merged
          
          # PC + Crossplatform
          cat rules/ads/pc.yaml > merged/ads_pc.yaml
          echo "" >> merged/ads_pc.yaml
          sed '/^payload:/d' rules/ads/crossplatform.yaml >> merged/ads_pc.yaml
          
          # Android + Crossplatform
          cat rules/ads/android.yaml > merged/ads_phone.yaml
          echo "" >> merged/ads_phone.yaml
          sed '/^payload:/d' rules/ads/crossplatform.yaml >> merged/ads_phone.yaml
          
          # Universal = PC + Crossplatform + Android
          cat rules/ads/pc.yaml > merged/ads_universal.yaml
          echo "" >> merged/ads_universal.yaml
          sed '/^payload:/d' rules/ads/crossplatform.yaml >> merged/ads_universal.yaml
          echo "" >> merged/ads_universal.yaml
          sed '/^payload:/d' rules/ads/android.yaml >> merged/ads_universal.yaml
          
          python3 scripts/deduplicate.py

      - name: Compile MRS files
        run: |
          mkdir -p mrs
          
          echo "=== Сборка ads_pc.mrs ==="
          ./mihomo convert-ruleset domain yaml merged/ads_pc.yaml mrs/ads_pc.mrs || echo "FAILED: ads_pc"
          
          echo "=== Сборка ads_phone.mrs ==="
          ./mihomo convert-ruleset domain yaml merged/ads_phone.yaml mrs/ads_phone.mrs || echo "FAILED: ads_phone"
          
          echo "=== Сборка ads_universal.mrs ==="
          ./mihomo convert-ruleset domain yaml merged/ads_universal.yaml mrs/ads_universal.mrs || echo "FAILED: ads_universal"
          
          echo "=== Сборка direct.mrs ==="
          ./mihomo convert-ruleset domain yaml rules/direct.yaml mrs/direct.mrs || echo "FAILED: direct"
          
          echo "=== Сборка proxy.mrs ==="
          ./mihomo convert-ruleset domain yaml rules/proxy.yaml mrs/proxy.mrs || echo "FAILED: proxy"
          
          echo ""
          echo "=== РАЗМЕРЫ MRS ==="
          ls -la mrs/

      - name: Deploy to lists branch (incremental)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin lists 2>/dev/null || true
          git checkout lists 2>/dev/null || git checkout --orphan lists
          
          cp -f mrs/ads_pc.mrs ./ads_pc.mrs
          cp -f mrs/ads_phone.mrs ./ads_phone.mrs
          cp -f mrs/ads_universal.mrs ./ads_universal.mrs
          cp -f mrs/direct.mrs ./direct.mrs
          cp -f mrs/proxy.mrs ./proxy.mrs
          
          rm -rf mrs merged
          
          git add ads_pc.mrs ads_phone.mrs ads_universal.mrs direct.mrs proxy.mrs
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: lists $(date -u +'%Y-%m-%d %H:%M UTC')"
            
            git push origin lists --force-with-lease || {
              echo "Push failed, retrying with pull --rebase..."
              git pull --rebase origin lists
              git push origin lists --force-with-lease || git push origin lists --force
            }
          fi

      - name: Update README in main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          git fetch origin lists 2>/dev/null || true
          git pull --rebase origin main
          python3 scripts/update_readme.py
          
          git add README.md
          git commit -m "update: readme links $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          
          git push origin main || {
            echo "Push failed, retrying with pull --rebase..."
            git pull --rebase origin main
            git push origin main
          }