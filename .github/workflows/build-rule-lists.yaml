name: Build Rule Lists

on:
  push:
    paths:
      - 'rules/ads/**.yaml'
      - 'hosts/**.txt'
      - 'rules/direct.yaml'
      - 'rules/proxy.yaml'
      - 'scripts/deduplicate.py'
      - 'scripts/update_readme.py'
      - '.github/workflows/build-rule-lists.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo binary
        run: |
          MIHOMO_VERSION="v1.19.0"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Merge YAML files
        run: |
          mkdir -p merged
          
          # PC + Crossplatform
          cat rules/ads/pc.yaml > merged/ads_pc.yaml
          echo "" >> merged/ads_pc.yaml
          sed '/^payload:/d' rules/ads/crossplatform.yaml >> merged/ads_pc.yaml
          
          # Android + Crossplatform
          cat rules/ads/android.yaml > merged/ads_phone.yaml
          echo "" >> merged/ads_phone.yaml
          sed '/^payload:/d' rules/ads/crossplatform.yaml >> merged/ads_phone.yaml
          
          # Дедупликация правил
          python3 scripts/deduplicate.py

      - name: Compile MRS files
        run: |
          mkdir -p mrs
          
          ./mihomo convert-ruleset domain yaml merged/ads_pc.yaml mrs/ads_pc.mrs
          ./mihomo convert-ruleset domain yaml merged/ads_phone.yaml mrs/ads_phone.mrs
          ./mihomo convert-ruleset domain yaml rules/direct.yaml mrs/direct.mrs
          ./mihomo convert-ruleset domain yaml rules/proxy.yaml mrs/proxy.mrs

      - name: Convert hosts TXT to LIST
        run: |
          mkdir -p hosts_out
          
          # Копируем TXT в .list
          cp hosts/hosts_pc.txt hosts_out/hosts_pc.list
          cp hosts/hosts_android.txt hosts_out/hosts_android.list
          
          # Дедупликация отдельных файлов
          for f in hosts_out/hosts_pc.list hosts_out/hosts_android.list; do
            grep '^\s*#' "$f" > /tmp/comments.txt
            grep -v '^\s*#' "$f" | grep -v '^\s*$' | awk '!seen[$1]++' > /tmp/domains.txt
            cat /tmp/comments.txt > "$f"
            echo "" >> "$f"
            cat /tmp/domains.txt >> "$f"
          done
          
          # Universal = PC + Android с удалением дубликатов
          echo "# Universal hosts — объединение PC + Android" > hosts_out/hosts_universal.list
          echo "" >> hosts_out/hosts_universal.list
          cat hosts/hosts_pc.txt hosts/hosts_android.txt \
            | grep -v '^\s*#' \
            | grep -v '^\s*$' \
            | awk '!seen[$1]++' >> hosts_out/hosts_universal.list

      - name: Deploy to lists branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan lists 2>/dev/null || git checkout lists
          git rm -rf . 2>/dev/null || true
          
          cp -f mrs/ads_pc.mrs ./ads_pc.mrs
          cp -f mrs/ads_phone.mrs ./ads_phone.mrs
          cp -f mrs/direct.mrs ./direct.mrs
          cp -f mrs/proxy.mrs ./proxy.mrs
          
          cp -f hosts_out/hosts_pc.list ./hosts_pc.list
          cp -f hosts_out/hosts_android.list ./hosts_android.list
          cp -f hosts_out/hosts_universal.list ./hosts_universal.list
          
          rm -rf mrs merged hosts_out
          
          git add ads_pc.mrs ads_phone.mrs direct.mrs proxy.mrs hosts_pc.list hosts_android.list hosts_universal.list
          git commit -m "update: lists $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin lists --force-with-lease || git push origin lists --force

      - name: Update README in main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          python3 scripts/update_readme.py
          
          git add README.md
          git commit -m "update: readme links $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin main