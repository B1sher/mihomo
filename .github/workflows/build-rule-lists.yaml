name: Build Rule Lists

on:
  push:
    paths:
      - 'rules/ads/**.yaml'
      - 'hosts/**.txt'
      - 'rules/direct.yaml'
      - 'rules/proxy.yaml'
      - 'scripts/deduplicate.py'
      - 'scripts/update_readme.py'
      - '.github/workflows/build-rule-lists.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo binary
        run: |
          MIHOMO_VERSION="v1.19.0"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Convert +.domain to DOMAIN-SUFFIX (temp copy for MRS)
        run: |
          convert_for_mrs() {
            local input="$1"
            local output="$2"
            
            echo "=== Конвертация для MRS: $input ==="
            
            sed -E 's/#.*$//' "$input" \
              | sed -E 's/^[[:space:]]*-[[:space:]]*\+\./DOMAIN-SUFFIX,/' \
              | sed -E 's/^[[:space:]]*-[[:space:]]*//' \
              | sed -E 's/[[:space:]]+$//' \
              | grep -v '^$' \
              | grep -v '^payload:' > /tmp/body.txt
            
            if [ ! -s /tmp/body.txt ]; then
              echo "ERROR: $input → пустой файл!"
              cat "$input"
              exit 1
            fi
            
            echo "payload:" > "$output"
            cat /tmp/body.txt >> "$output"
            
            echo "OK: $output ($(wc -l < /tmp/body.txt) строк)"
          }
          
          mkdir -p converted
          
          convert_for_mrs rules/ads/pc.yaml converted/pc.yaml
          convert_for_mrs rules/ads/android.yaml converted/android.yaml
          convert_for_mrs rules/ads/crossplatform.yaml converted/crossplatform.yaml
          convert_for_mrs rules/direct.yaml converted/direct.yaml
          convert_for_mrs rules/proxy.yaml converted/proxy.yaml

      - name: Merge YAML files
        run: |
          mkdir -p merged
          
          # PC + Crossplatform
          cat converted/pc.yaml > merged/ads_pc.yaml
          echo "" >> merged/ads_pc.yaml
          sed '/^payload:/d' converted/crossplatform.yaml >> merged/ads_pc.yaml
          
          # Android + Crossplatform
          cat converted/android.yaml > merged/ads_phone.yaml
          echo "" >> merged/ads_phone.yaml
          sed '/^payload:/d' converted/crossplatform.yaml >> merged/ads_phone.yaml
          
          # Universal = PC + Crossplatform + Android
          cat converted/pc.yaml > merged/ads_universal.yaml
          echo "" >> merged/ads_universal.yaml
          sed '/^payload:/d' converted/crossplatform.yaml >> merged/ads_universal.yaml
          echo "" >> merged/ads_universal.yaml
          sed '/^payload:/d' converted/android.yaml >> merged/ads_universal.yaml
          
          python3 scripts/deduplicate.py

      - name: Debug merged files
        run: |
          echo "=== merged/ads_pc.yaml (первые 20 строк) ==="
          head -20 merged/ads_pc.yaml
          echo ""
          echo "=== merged/ads_phone.yaml (первые 20 строк) ==="
          head -20 merged/ads_phone.yaml
          echo ""
          echo "=== merged/ads_universal.yaml (первые 20 строк) ==="
          head -20 merged/ads_universal.yaml
          echo ""
          echo "=== converted/direct.yaml ==="
          cat converted/direct.yaml
          echo ""
          echo "=== converted/proxy.yaml ==="
          cat converted/proxy.yaml
          echo ""
          echo "=== РАЗМЕРЫ ФАЙЛОВ ==="
          wc -l merged/ads_pc.yaml merged/ads_phone.yaml merged/ads_universal.yaml converted/direct.yaml converted/proxy.yaml

      - name: Compile MRS files
        run: |
          mkdir -p mrs
          
          ./mihomo convert-ruleset domain yaml merged/ads_pc.yaml mrs/ads_pc.mrs
          ./mihomo convert-ruleset domain yaml merged/ads_phone.yaml mrs/ads_phone.mrs
          ./mihomo convert-ruleset domain yaml merged/ads_universal.yaml mrs/ads_universal.mrs
          ./mihomo convert-ruleset domain yaml converted/direct.yaml mrs/direct.mrs
          ./mihomo convert-ruleset domain yaml converted/proxy.yaml mrs/proxy.mrs

      - name: Convert hosts TXT to LIST
        run: |
          mkdir -p hosts_out
          
          cp hosts/hosts_pc.txt hosts_out/hosts_pc.list
          cp hosts/hosts_phone.txt hosts_out/hosts_phone.list
          
          for f in hosts_out/hosts_pc.list hosts_out/hosts_phone.list; do
            grep '^\s*#' "$f" > /tmp/comments.txt
            grep -v '^\s*#' "$f" | grep -v '^\s*$' | awk '!seen[$1]++' > /tmp/domains.txt
            cat /tmp/comments.txt > "$f"
            echo "" >> "$f"
            cat /tmp/domains.txt >> "$f"
          done
          
          echo "# Universal hosts — объединение PC + Phone" > hosts_out/hosts_universal.list
          echo "" >> hosts_out/hosts_universal.list
          cat hosts/hosts_pc.txt hosts/hosts_phone.txt \
            | grep -v '^\s*#' \
            | grep -v '^\s*$' \
            | awk '!seen[$1]++' >> hosts_out/hosts_universal.list

      - name: Deploy to lists branch (incremental)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin lists 2>/dev/null || true
          git checkout lists 2>/dev/null || git checkout --orphan lists
          
          cp -f mrs/ads_pc.mrs ./ads_pc.mrs
          cp -f mrs/ads_phone.mrs ./ads_phone.mrs
          cp -f mrs/ads_universal.mrs ./ads_universal.mrs
          cp -f mrs/direct.mrs ./direct.mrs
          cp -f mrs/proxy.mrs ./proxy.mrs
          
          cp -f hosts_out/hosts_pc.list ./hosts_pc.list
          cp -f hosts_out/hosts_phone.list ./hosts_phone.list
          cp -f hosts_out/hosts_universal.list ./hosts_universal.list
          
          rm -rf mrs merged converted hosts_out
          
          git add ads_pc.mrs ads_phone.mrs ads_universal.mrs direct.mrs proxy.mrs hosts_pc.list hosts_phone.list hosts_universal.list
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: lists $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin lists --force-with-lease || git push origin lists --force
          fi

      - name: Update README in main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          git fetch origin lists 2>/dev/null || true
          python3 scripts/update_readme.py
          
          git add README.md
          git commit -m "update: readme links $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin main